<<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Page</title>

<style>
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: linear-gradient(45deg, rgb(116,211,211), rgb(56,56,143), rgb(83,4,83));
  margin: 0;
}

h1 {
  color: cyan;
  text-shadow: 0 0 5px cyan;
}

form {
  backdrop-filter: blur(20px);
  display: flex;
  flex-direction: column;
  width: 260px;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 15px rgba(0,0,0,0.5);
}

label {
  color: greenyellow;
  margin-top: 10px;
}

input, textarea {
  margin-top: 5px;
  padding: 8px;
  border-radius: 5px;
  border: none;
  transition: 1s;
}
input:hover , textarea:hover{
  box-shadow: 0 0 10px cyan;
}

button {
  margin-top: 15px;
  padding: 10px;
  background: black;
  color: cyan;
  border: none;
  cursor: pointer;
  transition: 0.3s;
  border-radius: 10px;
font-weight: bolder;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 10px cyan;
}

#status {
  margin-top: 10px;
  color: white;
}
</style>

</head>

<body>

<h1>Contact Me</h1>

<form id="contact-form">
  <label>Name:</label>
  <input type="text" name="name" required>

  <label>Email:</label>
  <input type="email" name="email" required>

  <label>Message:</label>
  <textarea name="message" required></textarea>

  <button type="submit">Send</button>
</form>

<p id="status"></p>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function() {
  emailjs.init("0hY90thqlDITSA0NS"); // ߔ replace
})();

document.getElementById("contact-form")
.addEventListener("submit", function(e) {
  e.preventDefault();

  emailjs.sendForm(
    "service_mvz7ygf",   // ߔ replace
    "template_64t3zup",  // ߔ replace
    this
  ).then(function() {
    document.getElementById("status").innerText = "✅ message sent to balaji";
  }, function(error) {
    document.getElementById("status").innerText = "❌ Failed! better luck next time";
    console.log(error);
  });
});
</script>

</body>
</html>
